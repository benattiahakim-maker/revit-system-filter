name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 et .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Egis.Revit.SystemFilter.sln

      - name: Build (Release - Revit 2026 + 2027)
        run: dotnet build Egis.Revit.SystemFilter.sln --configuration Release --no-restore

      - name: Tests (logique ZIP / settings / liens, sans Revit)
        run: dotnet test src/Egis.Revit.SystemFilter.DesignAutomation.Io.Tests --configuration Release

      - name: Tests outils APS (Aps, DaManager, WorkItemRunner ; HTTP simulé, aucun appel APS)
        run: |
          dotnet test tools/Egis.Revit.SystemFilter.Aps.Tests --configuration Release
          dotnet test tools/Egis.Revit.SystemFilter.DaManager.Tests --configuration Release
          dotnet test tools/Egis.Revit.SystemFilter.WorkItemRunner.Tests --configuration Release

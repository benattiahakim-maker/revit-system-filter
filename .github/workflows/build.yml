name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 et .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Egis.Revit.SystemFilter.sln

      - name: Build (Release - Revit 2026 + 2027)
        run: dotnet build Egis.Revit.SystemFilter.sln --configuration Release --no-restore
